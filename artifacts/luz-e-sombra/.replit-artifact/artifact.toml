kind = "web"
previewPath = "/"
title = "Da Sombra à Luz"
version = "1.0.0"
id = "artifacts/luz-e-sombra"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18367

[services.development]
run = "pnpm --filter @workspace/luz-e-sombra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/luz-e-sombra", "run", "build" ]
publicDir = "artifacts/luz-e-sombra/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18367"
BASE_PATH = "/"
