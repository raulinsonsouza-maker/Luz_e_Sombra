# LuzeSombra — portaliluminando.com.br
# CRÍTICO: /assets/ NÃO pode cair em index.html.

# HTTP www → HTTPS apex
server {
    listen 80;
    listen [::]:80;
    server_name www.portaliluminando.com.br;
    return 301 https://portaliluminando.com.br$request_uri;
}

# HTTP apex → HTTPS apex
server {
    listen 80;
    listen [::]:80;
    server_name portaliluminando.com.br;
    return 301 https://portaliluminando.com.br$request_uri;
}

# HTTPS www → HTTPS apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.portaliluminando.com.br;

    ssl_certificate /etc/letsencrypt/live/portaliluminando.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portaliluminando.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://portaliluminando.com.br$request_uri;
}

# HTTPS apex (produção)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portaliluminando.com.br;

    ssl_certificate /etc/letsencrypt/live/portaliluminando.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portaliluminando.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/luzesombra/artifacts/luz-e-sombra/dist/public;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /robots.txt { try_files $uri =404; add_header Cache-Control "public, max-age=3600" always; }
    location = /sitemap.xml { try_files $uri =404; add_header Cache-Control "public, max-age=3600" always; }
    location = /llms.txt { try_files $uri =404; add_header Cache-Control "public, max-age=3600" always; }
    location = /llms-full.txt { try_files $uri =404; add_header Cache-Control "public, max-age=3600" always; }
    location = /humans.txt { try_files $uri =404; add_header Cache-Control "public, max-age=3600" always; }
    location = /site.webmanifest { try_files $uri =404; }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

