# LuzeSombra — frontend estático + proxy /api/ para Node (porta 8080)
# Domínios: portaliluminando.com.br (produção) e vps62823.publiccloud.com.br (legado)
#
# Instalação na VPS:
#   cp scripts/nginx/luzesombra.conf /etc/nginx/sites-available/luzesombra
#   ln -sf /etc/nginx/sites-available/luzesombra /etc/nginx/sites-enabled/luzesombra
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d portaliluminando.com.br -d www.portaliluminando.com.br
#
# Nota: domínio novo pode levar até 24–48h para propagar DNS globalmente.
# Se o certbot falhar no www, tente de novo depois com --expand.

# --- portaliluminando.com.br (HTTP inicial; certbot adiciona bloco HTTPS) ---
server {
    listen 80;
    listen [::]:80;
    server_name portaliluminando.com.br www.portaliluminando.com.br;

    root /opt/luzesombra/artifacts/luz-e-sombra/dist/public;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}

# --- vps62823.publiccloud.com.br (legado) ---
server {
    listen 80;
    listen [::]:80;
    server_name vps62823.publiccloud.com.br;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vps62823.publiccloud.com.br;

    ssl_certificate /etc/letsencrypt/live/vps62823.publiccloud.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps62823.publiccloud.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/luzesombra/artifacts/luz-e-sombra/dist/public;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
